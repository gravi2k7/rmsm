name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  install-and-static-checks:
    name: Install, Lint, Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    needs: install-and-static-checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rmsm
          POSTGRES_PASSWORD: rmsm
          POSTGRES_DB: rmsm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rmsm" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://rmsm:rmsm@localhost:5432/rmsm_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-secret-access-000000
      JWT_REFRESH_SECRET: ci-test-secret-refresh-000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @rmsm/database generate
      - name: Run migrations
        run: pnpm --filter @rmsm/database migrate:deploy
      - name: Run unit + e2e tests
        run: pnpm test

  build:
    name: Build all apps
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rmsm/database generate
      - run: pnpm build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/web/.next
            apps/admin/.next
            apps/api/dist
          retention-days: 7

  docker-build:
    name: Docker build (all services)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [api, web, admin, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          target: production
          push: false
          tags: rmsm-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
