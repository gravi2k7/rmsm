# Production stack - Milestone 5.1.2.
#
# Contrast with docker-compose.yml (dev): every app service here builds
# the `production` Dockerfile target (not `dev`), no source is
# bind-mounted (production images are self-contained per their own
# Dockerfile - see apps/api, apps/web, apps/admin), and every secret is
# sourced from the environment rather than a checked-in default. This
# file does not itself supply Postgres/Redis credentials or app secrets -
# see the `environment` blocks below and .env.example for what must be
# set in a real deployment's env before `docker compose -f
# docker-compose.prod.yml up` will start successfully. In particular,
# apps/api will refuse to start (Milestone 5.1.1's fail-fast production
# guard, packages/config/src/env/env.validator.ts) if COOKIE_SECRET,
# TWO_FACTOR_ENCRYPTION_KEY, NOTIFICATION_CREDENTIALS_ENCRYPTION_KEY,
# MOCK_WEBHOOK_SECRET, or WEB_APP_URL are left unset/at their dev default
# - this is intentional, not a bug to work around.
#
# HONEST LIMITATION: this file has been reviewed carefully and the
# individual Dockerfiles it references have been verified as described in
# infra/docker/README.md, but this compose file itself has not been
# executed - there is no `docker` binary in the sandbox this was authored
# in. Verify with `docker compose -f docker-compose.prod.yml config` and
# a real `up` before relying on it.


networks:
  rmsm_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rmsm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rmsm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmsm} -d ${POSTGRES_DB:-rmsm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port published by default - production Postgres should not
    # be reachable outside the compose network unless a deployment
    # deliberately needs it (e.g. for a migration job). Uncomment if
    # needed:
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - rmsm_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rmsm}
      REDIS_URL: redis://redis:6379
      # Every value below MUST be overridden - the container's own
      # startup validation (Milestone 5.1.1) refuses to boot with any of
      # these left unset or at a known dev-only default. See
      # .env.example for how to generate real values.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?set TWO_FACTOR_ENCRYPTION_KEY}
      NOTIFICATION_CREDENTIALS_ENCRYPTION_KEY: ${NOTIFICATION_CREDENTIALS_ENCRYPTION_KEY:?set NOTIFICATION_CREDENTIALS_ENCRYPTION_KEY}
      MOCK_WEBHOOK_SECRET: ${MOCK_WEBHOOK_SECRET:?set MOCK_WEBHOOK_SECRET}
      WEB_APP_URL: ${WEB_APP_URL:?set WEB_APP_URL, must not be localhost}
      API_PORT: "3001"
      # Optional integrations pass through unset if not provided -
      # apps/api's own config layer treats each as an independently
      # disable-able provider (see packages/config's platformIntegrationsSchema).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
    ports:
      - "3001:3001"
    networks:
      - rmsm_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai:
    build:
      context: ../../
      dockerfile: apps/ai/Dockerfile
      target: production
    restart: unless-stopped
    env_file: ../../apps/ai/.env
    networks:
      - rmsm_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL, the browser-facing API URL}
    ports:
      - "3000:3000"
    networks:
      - rmsm_network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin:
    build:
      context: ../../
      dockerfile: apps/admin/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
    ports:
      - "3002:3002"
    networks:
      - rmsm_network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
