networks:
  rmsm_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rmsm
      POSTGRES_PASSWORD: rmsm_dev_password
      POSTGRES_DB: rmsm_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [rmsm_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmsm -d rmsm_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks: [rmsm_network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
      target: dev
    env_file: ../../.env
    ports:
      - "3001:3001"
    volumes:
    - ../../:/workspace
    - /workspace/node_modules
    - /workspace/apps/api/node_modules
    - /workspace/packages/config/node_modules
    - /workspace/packages/core/node_modules
    - /workspace/packages/database/node_modules
    - /workspace/packages/decision/node_modules
    - /workspace/packages/execution/node_modules
    - /workspace/packages/market/node_modules
    - /workspace/packages/opportunity/node_modules
    - /workspace/packages/portfolio/node_modules
    - /workspace/packages/shared/node_modules
    - /workspace/packages/strategy/node_modules
    - /workspace/packages/types/node_modules
    networks: [rmsm_network]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai:
    build:
      context: ../../
      dockerfile: apps/ai/Dockerfile
      target: dev
    env_file: ../../apps/ai/.env
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/ai:/app
    networks: [rmsm_network]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
      target: dev
    env_file: ../../.env
    ports:
      - "3000:3000"
    volumes:
    - ../../:/workspace
    - /workspace/node_modules
    - /workspace/apps/web/node_modules
    - /workspace/apps/web/.next
    networks: [rmsm_network]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  admin:
    build:
      context: ../../
      dockerfile: apps/admin/Dockerfile
      target: dev
    env_file: ../../.env
    ports:
      - "3002:3002"
    volumes:
    - ../../:/workspace
    - /workspace/node_modules
    - /workspace/apps/admin/node_modules
    - /workspace/apps/admin/.next
    networks: [rmsm_network]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
